<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shape Dash</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Main Menu -->
    <div id="mainMenu" class="menu active">
        <h1 class="game-title">GEOMETRY DASH</h1>
        <p class="game-subtitle">Shape Edition</p>
        <div class="menu-buttons">
            <div class="level-buttons">
                <button class="level-btn" onclick="selectLevel(0)">
                    <span class="level-number">1</span>
                    <span class="level-name">Neon Runner</span>
                </button>
                <button class="level-btn" onclick="selectLevel(1)">
                    <span class="level-number">2</span>
                    <span class="level-name">Shape Shifter</span>
                </button>
                <button class="level-btn" onclick="selectLevel(2)">
                    <span class="level-number">3</span>
                    <span class="level-name">Quantum Leap</span>
                </button>
            </div>
            <button class="menu-btn practice" onclick="togglePracticeMode()">
                <span class="practice-icon">⚙</span> Practice Mode: <span id="practiceStatus">OFF</span>
            </button>
        </div>
    </div>

    <!-- Game Container -->
    <div id="gameContainer" class="hidden">
        <canvas id="gameCanvas"></canvas>
        
        <!-- Game UI -->
        <div id="gameUI">
            <div class="top-bar">
                <div class="stat attempt-counter">
                    <span class="stat-label">Attempt</span>
                    <span class="stat-value" id="attemptCount">0</span>
                </div>
                <div class="stat level-name">
                    <span id="levelName">Level</span>
                </div>
                <div class="stat progress-counter">
                    <span class="stat-value" id="progressPercent">0</span><span class="percent-symbol">%</span>
                </div>
                <button class="pause-btn" onclick="togglePause()">⏸</button>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <!-- Pause Menu -->
        <div id="pauseMenu" class="menu hidden">
            <h2>PAUSED</h2>
            <button class="menu-btn" onclick="togglePause()">Resume</button>
            <button class="menu-btn" onclick="restartLevel()">Restart</button>
            <button class="menu-btn" onclick="exitToMenu()">Main Menu</button>
        </div>

        <!-- Death Screen -->
        <div id="deathScreen" class="hidden">
            <h2 class="death-title">GAME OVER</h2>
            <div class="death-stats">
                <p>Progress: <span id="deathProgress">0</span>%</p>
            </div>
            <button class="menu-btn" onclick="restartLevel()">Try Again</button>
            <button class="menu-btn" onclick="exitToMenu()">Main Menu</button>
        </div>

        <!-- Level Complete Screen -->
        <div id="completeScreen" class="hidden">
            <h2 class="complete-title">LEVEL COMPLETE!</h2>
            <div class="stars-display">
                <span class="star">⭐</span>
                <span class="star">⭐</span>
                <span class="star">⭐</span>
            </div>
            <div class="complete-stats">
                <div class="stat-row">
                    <span class="stat-icon">🏃</span>
                    <span class="stat-text">Attempts:</span>
                    <span class="stat-number" id="completeAttempts">0</span>
                </div>
                <div class="stat-row">
                    <span class="stat-icon">🪙</span>
                    <span class="stat-text">Coins:</span>
                    <span class="stat-number"><span id="completeCoins">0</span>/<span id="totalCoins">0</span></span>
                </div>
            </div>
            <button class="menu-btn" onclick="exitToMenu()">Main Menu</button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/audio.js"></script>
    <script src="js/player.js"></script>
    <script src="js/obstacles.js"></script>
    <script src="js/levels.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
